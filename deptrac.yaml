# laravel-bounded ships this Deptrac config as a starter template.
#
# - Layer-level boundaries (Controllers → Services etc.) are enforced here.
# - The `Eloquent` layer restricts ORM imports to Repositories / Queries /
#   Models — the package's headline persistence boundary.
# - Middleware-import boundaries are enforced by the package's PHPStan rule
#   (`bounded.middlewareServiceImport`), not here, so Middleware is intentionally
#   not a Deptrac layer — keeping it out avoids blocking legitimate framework
#   imports while leaving the rule that matters in place.

deptrac:
    paths:
        - ./app

    layers:
        -
            name: Controllers
            collectors:
                -
                    type: directory
                    value: app/Http/Controllers/.*

        -
            name: Commands
            collectors:
                -
                    type: directory
                    value: app/Console/Commands/.*

        -
            name: Services
            collectors:
                -
                    type: directory
                    value: app/Services/.*

        -
            name: Repositories
            collectors:
                -
                    type: directory
                    value: app/Repositories/.*

        -
            name: Queries
            collectors:
                -
                    type: directory
                    value: app/Queries/.*

        -
            name: Integrations
            collectors:
                -
                    type: directory
                    value: app/Integrations/.*

        -
            name: Models
            collectors:
                -
                    type: directory
                    value: app/Models/.*

        -
            name: Jobs
            collectors:
                -
                    type: directory
                    value: app/Jobs/.*

        -
            name: Providers
            collectors:
                -
                    type: directory
                    value: app/Providers/.*

        -
            name: Eloquent
            collectors:
                -
                    type: classlike
                    value: ^Illuminate\\Database\\Eloquent\\.*$

    ruleset:
        Controllers:
            - Services
            - Models
            - Jobs
        Commands:
            - Services
            - Models
            - Jobs
        Services:
            - Repositories
            - Queries
            - Integrations
            - Models
            - Jobs
        Repositories:
            - Models
            - Eloquent
        Queries:
            - Models
            - Eloquent
        Integrations:
            - Models
        Jobs:
            - Services
            - Models
        Models:
            - Eloquent
        Providers: ~
        Eloquent: ~

    skip_violations: ~
